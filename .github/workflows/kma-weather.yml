name: BR TC weather (KMA 7am) and Pages

on:
  push:
    branches: [main]
  schedule:
    # 매시 17분(UTC). 실제 실행시각은 지연될 수 있습니다.
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: brothers-weather-pages
  cancel-in-progress: false

jobs:
  build:
    name: Refresh weather and upload Pages artifact
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refresh KMA forecast
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: |
          if [ -z "$KMA_SERVICE_KEY" ]; then
            echo '::error::KMA_SERVICE_KEY repository secret is missing.'
            exit 1
          fi
          python scripts/update_kma_weather.py || echo '::warning::KMA update failed; keeping existing weather.json.'
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('weather.json').read_text(encoding='utf-8'))
          if not data.get('days'):
              raise SystemExit('weather.json has no forecast days. Check the KMA API log above.')
          print('Forecast ready:', data.get('updatedAt'), len(data['days']), 'day(s)')
          PY

      - name: Commit newest public weather JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add weather.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh public KMA forecast [skip ci]'
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: .

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Allow artifact metadata to become available
        run: sleep 15
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
